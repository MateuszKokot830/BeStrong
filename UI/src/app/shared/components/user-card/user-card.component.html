<div class="card bg-dark mb-4">
  <div class="card-img-wrapper">
    <img src="{{user.profilePhotoUrl}}" alt="{{user.userName}}" class="card-img-top" (click)="goToProfile(user.userName)">
    @if (!isOwnCard) {
    <button
      type="button"
      class="btn btn-sm follow-btn"
      [class.btn-success]="!isFollowed"
      [class.btn-danger]="isFollowed"
      (click)="toggleFollow($event)"
    >
      {{ isFollowed ? 'Unfollow' : 'Follow' }}
    </button>
    }
  </div>
  <div class="card-body p-1">
    <h6 class="card-title text-center mb-1">
      <i class="me-2">
        {{user.userName}}
      </i>
    </h6>
    <p class="card-text text-muted text-center">{{user.name}} {{user.surname}}</p>
  </div>
</div>
