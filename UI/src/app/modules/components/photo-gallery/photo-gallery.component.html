<div class="photo-gallery" *ngIf="photos.length; else noPhotos">
  <div class="gallery-main">
    <button type="button" class="gallery-nav gallery-prev" (click)="previous()" *ngIf="photos.length > 1" aria-label="Previous photo">
      <i class="bi bi-chevron-left"></i>
    </button>
    <img [src]="currentPhoto?.url" [alt]="'Photo ' + (currentIndex + 1) + ' of ' + photos.length" class="gallery-image">
    <button type="button" class="gallery-nav gallery-next" (click)="next()" *ngIf="photos.length > 1" aria-label="Next photo">
      <i class="bi bi-chevron-right"></i>
    </button>
  </div>
  <div class="gallery-thumbnails" *ngIf="photos.length > 1">
    <img *ngFor="let photo of photos; let i = index"
      [src]="photo.url"
      [class.active]="i === currentIndex"
      (click)="select(i)"
      class="gallery-thumbnail"
      alt="Thumbnail">
  </div>
</div>
<ng-template #noPhotos>
  <p class="text-white text-center">No photos yet.</p>
</ng-template>
