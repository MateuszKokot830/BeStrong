@if (photos.length) {
<div class="photo-gallery">
  <div class="gallery-main">
    @if (photos.length > 1) {
    <button type="button" class="gallery-nav gallery-prev" (click)="previous()" aria-label="Previous photo">
      <i class="bi bi-chevron-left"></i>
    </button>
    }
    <img [src]="currentPhoto?.url" [alt]="'Photo ' + (currentIndex + 1) + ' of ' + photos.length" class="gallery-image" />
    @if (photos.length > 1) {
    <button type="button" class="gallery-nav gallery-next" (click)="next()" aria-label="Next photo">
      <i class="bi bi-chevron-right"></i>
    </button>
    }
  </div>
  @if (photos.length > 1) {
  <div class="gallery-thumbnails">
    @for (photo of photos; track photo; let i = $index) {
    <img [src]="photo.url" [class.active]="i === currentIndex" (click)="select(i)" class="gallery-thumbnail" alt="Thumbnail" />
    }
  </div>
  }
</div>
} @else {
<p class="text-white text-center">No photos yet.</p>
}
