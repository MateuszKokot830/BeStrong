<form #registerForm="ngForm" (ngSubmit)="register()" autocomplete="off">
    <div class="modal-header text-center">
        <h2 class="text-primary w-100">Register</h2>
        <button type="button" class="close pull-right" aria-label="Close" (click)="bsModalRef.hide()">
        <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body">
            <input type="text" class="form-control mb-2" name="username" [(ngModel)]="model.username" placeholder="Username">
            <input type="password" class="form-control mb-2" name="password" [(ngModel)]="model.password" placeholder="Password">
    </div>
    <div class="modal-footer text-center">
        <button class="btn btn-success mr-2" type="submit">Register</button>
        <button class="btn btn-secondary mr-2" type="button" (click)="bsModalRef.hide()">Cancel</button>
    </div>
</form>
